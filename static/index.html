<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-brand">
        <span class="logo">💬</span>
        <h1>Chat Room</h1>
      </div>
      <div class="user-badge" id="user-badge" hidden>
        <span id="display-name"></span>
        <button type="button" id="change-name" class="btn-ghost">Change name</button>
      </div>
    </header>

    <main class="chat-container">
      <div id="welcome" class="welcome-panel">
        <h2>Welcome</h2>
        <p>Enter a name to join the conversation.</p>
        <form id="join-form">
          <input type="text" id="username-input" placeholder="Your name" maxlength="32" required autocomplete="name">
          <button type="submit" class="btn-primary">Join chat</button>
        </form>
      </div>

      <div id="chat-panel" class="chat-panel" hidden>
        <ul id="messages" class="messages" aria-live="polite"></ul>
        <form id="message-form" class="message-form">
          <input type="text" id="message-input" placeholder="Type a message…" maxlength="2000" required autocomplete="off">
          <button type="submit" class="btn-primary" aria-label="Send message">Send</button>
        </form>
      </div>
    </main>
  </div>
  <script src="/static/js/chat.js"></script>
</body>
</html>
